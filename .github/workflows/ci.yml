name: ContextCore CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: |
          ruff check services/gateway/app \
                       services/ingestion/app \
                       services/query/app \
                       services/processing/app \
                       --ignore E501,F401,E402,F811

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings \
                      python-jose[cryptography] passlib[bcrypt] tiktoken

      - name: Run gateway tests
        run: |
          cd services/gateway
          python -m pytest tests/ -v --tb=short

      - name: Run query tests
        run: |
          cd services/query
          python -m pytest tests/ -v --tb=short

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          push: false
          tags: contextcore-gateway:ci

      - name: Build Ingestion image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ingestion
          push: false
          tags: contextcore-ingestion:ci

      - name: Build Query image
        uses: docker/build-push-action@v5
        with:
          context: ./services/query
          push: false
          tags: contextcore-query:ci

      - name: Build Processing image
        uses: docker/build-push-action@v5
        with:
          context: ./services/processing
          push: false
          tags: contextcore-processing:ci
