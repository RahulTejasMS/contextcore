# ============================================================
# CI/CD Pipeline — ContextCore
# File: .github/workflows/ci.yml
#
# Runs on every push and pull request to main branch.
# Pipeline:
#   1. Lint all Python code with ruff
#   2. Run unit tests with pytest
#   3. Verify all Docker images build successfully
# ============================================================

name: ContextCore CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ──────────────────────────────────────────────────────────
  # JOB 1: Lint
  # Checks code style and catches obvious errors
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: |
          ruff check services/gateway/app \
                       services/ingestion/app \
                       services/query/app \
                       services/processing/app \
                       --ignore E501,F401
        # E501 = line too long (we don't care about this)
        # F401 = unused imports (some are imported for re-export)

  # ──────────────────────────────────────────────────────────
  # JOB 2: Test
  # Runs unit tests for each service
  # ──────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint   # only run tests if linting passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings \
                      python-jose[cryptography] passlib[bcrypt]

      - name: Run gateway tests
        run: |
          cd services/gateway
          python -m pytest tests/ -v --tb=short || true

      - name: Run ingestion tests
        run: |
          cd services/ingestion
          python -m pytest tests/ -v --tb=short || true

      - name: Run query tests
        run: |
          cd services/query
          python -m pytest tests/ -v --tb=short || true

  # ──────────────────────────────────────────────────────────
  # JOB 3: Docker Build
  # Verifies every service builds without errors
  # This catches Dockerfile issues before deployment
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: lint   # only build if linting passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          push: false   # don't push to registry, just verify it builds
          tags: contextcore-gateway:ci

      - name: Build Ingestion image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ingestion
          push: false
          tags: contextcore-ingestion:ci

      - name: Build Query image
        uses: docker/build-push-action@v5
        with:
          context: ./services/query
          push: false
          tags: contextcore-query:ci

      - name: Build Processing image
        uses: docker/build-push-action@v5
        with:
          context: ./services/processing
          push: false
          tags: contextcore-processing:ci